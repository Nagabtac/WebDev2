<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Car Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col items-center p-8">

    <div class="w-full max-w-6xl bg-white shadow-md rounded-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-semibold text-gray-700">Car Inventory</h1>
            <button onclick="openCreateModal()"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Add Car</button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border border-black border-collapse text-gray-800">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="border border-black px-3 py-2 text-left">No.</th>
                        <th class="border border-black px-3 py-2 text-left">Make</th>
                        <th class="border border-black px-3 py-2 text-left">Model</th>
                        <th class="border border-black px-3 py-2 text-left">Year</th>
                        <th class="border border-black px-3 py-2 text-left">Color</th>
                        <th class="border border-black px-3 py-2 text-left">Body Type</th>
                        <th class="border border-black px-3 py-2 text-left">Engine Type</th>
                        <th class="border border-black px-3 py-2 text-left">License Plate</th>
                        <th class="border border-black px-3 py-2 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="carTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="carModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
        <div class="bg-white rounded-lg w-96 p-6 shadow-lg">
            <h2 id="modalTitle" class="text-xl font-semibold mb-4 text-gray-800">Add Car</h2>
            <form id="carForm" onsubmit="saveCar(event)">
                <input type="hidden" id="carId">

                <div class="space-y-3">
                    <div>
                        <label class="block text-gray-700 font-medium">Make</label>
                        <input id="carMake" class="border border-gray-400 rounded w-full p-2" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium">Model</label>
                        <input id="carModel" class="border border-gray-400 rounded w-full p-2" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium">Year</label>
                        <input id="carYear" type="number" class="border border-gray-400 rounded w-full p-2" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium">Color</label>
                        <input id="carColor" class="border border-gray-400 rounded w-full p-2" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium">Body Type</label>
                        <input id="carBodyType" class="border border-gray-400 rounded w-full p-2" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium">Engine Type</label>
                        <input id="carEngineType" class="border border-gray-400 rounded w-full p-2" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium">License Plate</label>
                        <input id="carLicensePlate" class="border border-gray-400 rounded w-full p-2" required>
                    </div>
                </div>

                <div class="flex justify-end mt-6 space-x-2">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
