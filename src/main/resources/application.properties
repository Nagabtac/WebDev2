spring.application.name=webdev1_g1

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3310/car_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# Basic Security User (Note: This is separate from your User entity/service and usually not needed when using custom auth)
# It's generally better to remove these if you have CustomUserDetailsService handling users from the database.
spring.security.user.name=admin
spring.security.user.password=admin123

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=1000

# Session management (Primarily for the web part, API is stateless)
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true

# JWT Configuration
# Ensure this secret is strong and kept secure in a real application
jwt.secret=mySecretKey123456789012345678901234567890
# JWT Expiration Time in Milliseconds (Set to 3 minutes)
jwt.expiration=180000

