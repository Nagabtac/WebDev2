<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; color: #000; background: #fff; margin: 2rem; }
        a.button, button { display: inline-block; padding: 0.5rem 0.75rem; border: 1px solid #000; background: #fff; color: #000; text-decoration: none; cursor: pointer; }
        a.button:hover, button:hover { background: #000; color: #fff; }
        form { max-width: 480px; }
        label { display: block; margin-top: 1rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #000; }
        .actions { margin-top: 1rem; }
    </style>
</head>
<body>
<main>
    <h1>Login</h1>
    <div th:if="${param.error}" style="color: red; margin-bottom: 1rem;">
        Invalid username or password.
    </div>
    <div th:if="${successMessage}" style="color: green; margin-bottom: 1rem;" th:text="${successMessage}"></div>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label for="username">Username:</label>
        <input id="username" name="username" type="text" required>

        <label for="password">Password:</label>
        <input id="password" name="password" type="password" required>

        <div class="actions">
            <button type="submit">Login</button>
            <a class="button" th:href="@{/register}">Register</a>
        </div>
    </form>
</main>
</body>
</html>
