<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employees</title>
    <style>
        body { font-family: Arial, sans-serif; color: #000; background: #fff; margin: 2rem; }
        h1 { margin-bottom: 1rem; }
        a.button, button { display: inline-block; padding: 0.5rem 0.75rem; border: 1px solid #000; background: #fff; color: #000; text-decoration: none; cursor: pointer; }
        a.button:hover, button:hover { background: #000; color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #000; padding: 0.5rem; text-align: left; }
        thead { background: #000; color: #fff; }
        .actions a { margin-right: 0.5rem; }
    </style>
</head>
<body>
<main>
    <h1>Employees</h1>
    <div style="margin-bottom: 1rem;">
        <a class="button" th:href="@{/create}">Add New Employee</a>
        <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 1rem;">
            <button type="submit" class="button">Logout</button>
        </form>
    </div>
    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.email}"></td>
            <td class="actions">
                <a th:href="@{/view/{id}(id=${employee.id})}" class="button">View</a>
                <a th:href="@{/edit/{id}(id=${employee.id})}" class="button">Edit</a>
                <a th:href="@{/delete/{id}(id=${employee.id})}" class="button">Delete</a>
            </td>
        </tr>


        </tbody>
    </table>
</main>
</body>
</html>
