<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error</title>
    <style>
        body { font-family: Arial, sans-serif; color: #000; background: #fff; margin: 2rem; }
        a.button { display: inline-block; padding: 0.5rem 0.75rem; border: 1px solid #000; background: #fff; color: #000; text-decoration: none; cursor: pointer; }
        a.button:hover { background: #000; color: #fff; }
        .error-container { max-width: 600px; margin: 2rem auto; text-align: center; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Error</h1>
        <p th:text="${message}">Something went wrong</p>
        <a class="button" th:href="@{/}">Back to Home</a>
    </div>
</body>
</html>
