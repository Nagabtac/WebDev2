<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Error</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #2c2c2c;
    }
    .error-container {
      background-color: #f8f8f8;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid #000000;
    }
    .error-container h1 {
      color: #000000;
      margin-bottom: 20px;
      text-align: center;
    }
    .error-container p {
      margin: 20px 0;
      font-size: 16px;
      color: #000000;
      text-align: center;
    }
    .back-link {
      margin-top: 30px;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      border: 1px solid #000000;
      background-color: #ffffff;
      color: #000000;
    }
    .btn:hover {
      background-color: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>Error</h1>
    <p th:text="${message}">Something went wrong</p>
    <div class="back-link">
      <a class="btn" th:href="@{/}">← Back to Home</a>
    </div>
  </div>
</body>
</html>
