<form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div>
        <label>Username:</label>
        <input type="text" name="username"/>
    </div>
    <div>
        <label style="color: #fff;">Password:</label>
        <input type="password" name="password"/>
    </div>
    <button type="submit">Login</button>
</form>
<a th:href="@{/register}">Register</a>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #2c2c2c;
        margin: 0;
        padding: 0;
    }

    form {
        background: #f8f8f8;
        max-width: 350px;
        margin: 60px auto;
        padding: 30px 25px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    form div {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        color: #000;
    }

    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 15px;
        box-sizing: border-box;
    }

    button[type="submit"] {
        width: 100%;
        padding: 10px 0;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }

    button[type="submit"]:hover {
        background: #1976d2;
    }

    a {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #1976d2;
        text-decoration: none;
        font-size: 15px;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
