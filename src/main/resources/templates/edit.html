<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Car</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #2c2c2c;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #f8f8f8;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #000000;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #000000;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 5px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: 1px solid #000000;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-primary {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-primary:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-secondary:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .form-actions {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Car</h1>
        
        <form th:action="@{/edit/{id}(id=${car.id})}" th:object="${car}" method="post">
            <div class="form-group">
                <label for="make">Make:</label>
                <input type="text" id="make" th:field="*{make}" required>
                <div th:if="${#fields.hasErrors('make')}" th:errors="*{make}"></div>
            </div>
            
            <div class="form-group">
                <label for="model">Model:</label>
                <input type="text" id="model" th:field="*{model}" required>
                <div th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
            </div>
            
            <div class="form-group">
                <label for="year">Year:</label>
                <input type="number" id="year" th:field="*{year}" min="1900" max="2030" required>
                <div th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
            </div>
            
            <div class="form-group">
                <label for="color">Color:</label>
                <input type="text" id="color" th:field="*{color}" required>
                <div th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></div>
            </div>
            
            <div class="form-group">
                <label for="bodyType">Body Type:</label>
                <input type="text" id="bodyType" th:field="*{bodyType}" required>
                <div th:if="${#fields.hasErrors('bodyType')}" th:errors="*{bodyType}"></div>
            </div>
            
            <div class="form-group">
                <label for="engineType">Engine Type:</label>
                <input type="text" id="engineType" th:field="*{engineType}" required>
                <div th:if="${#fields.hasErrors('engineType')}" th:errors="*{engineType}"></div>
            </div>
            
            <div class="form-group">
                <label for="licensePlate">License Plate:</label>
                <input type="text" id="licensePlate" th:field="*{licensePlate}" required>
                <div th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"></div>
            </div>
            
            
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Car</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
