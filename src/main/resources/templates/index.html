<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cars.js"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <h1 class="text-2xl font-bold text-gray-800">Car Management System</h1>
                <div class="flex items-center space-x-4">
                    <span id="userInfo" class="text-gray-600 hidden"></span>
                    <button id="loginBtn" onclick="authManager.showLoginModal()" 
                            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Login
                    </button>
                    <button id="logoutBtn" onclick="authManager.logout()" 
                            class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 hidden">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Message Display -->
        <div id="message" class="hidden mb-6"></div>

        <!-- Action Buttons -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold text-gray-800">Cars</h2>
            <button onclick="openCreateModal()" 
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                Add New Car
            </button>
        </div>

        <!-- Cars Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Make</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Model</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Year</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Color</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="carTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Cars will be loaded here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Car Modal -->
    <div id="carModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="p-6">
                    <h3 id="modalTitle" class="text-2xl font-bold text-gray-900 mb-4">Add Car</h3>
                    <form id="carForm" onsubmit="saveCar(event)">
                        <input type="hidden" id="carId">
                        <div class="mb-4">
                            <label for="carMake" class="block text-sm font-medium text-gray-700 mb-2">Make</label>
                            <input type="text" id="carMake" name="make" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="mb-4">
                            <label for="carModel" class="block text-sm font-medium text-gray-700 mb-2">Model</label>
                            <input type="text" id="carModel" name="model" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="mb-4">
                            <label for="carYear" class="block text-sm font-medium text-gray-700 mb-2">Year</label>
                            <input type="number" id="carYear" name="year" required min="1900" max="2030"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="mb-6">
                            <label for="carColor" class="block text-sm font-medium text-gray-700 mb-2">Color</label>
                            <input type="text" id="carColor" name="color" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="flex space-x-3">
                            <button type="submit" 
                                    class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                Save
                            </button>
                            <button type="button" onclick="closeModal()"
                                    class="flex-1 bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Auth Modals -->
    <div th:replace="~{auth-modals}"></div>
</body>
</html>
