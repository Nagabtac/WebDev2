<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Management System</title>
    <script src="/js/fetch.jss"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #2c2c2c;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #000000;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: 1px solid #000000;
        }
        .btn-primary {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-primary:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-success {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-success:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-warning {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-warning:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .btn-danger {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-danger:hover {
            background-color: #000000;
            color: #ffffff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 1px solid #000000;
        }
        th, td {
            border: 1px solid #000000;
            padding: 12px;
            text-align: left;
            color: #000000;
        }
        th {
            background-color: #f8f8f8;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #e0e0e0;
        }
        tr:nth-child(odd) {
            background-color: #f8f8f8;
        }
        tr:hover {
            background-color: #d0d0d0;
        }
        .actions {
            text-align: center;
        }
        
        .hidden-column {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
                            <h1>Car Management System</h1>
                    

                    <div th:if="${message}" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center;">
                        <span th:text="${message}"></span>
                    </div>
                    
                    <div style="text-align: center; margin-bottom: 20px;">
                        <a href="/add" class="btn btn-primary">Add New Car</a>
                        <form th:action="@{/logout}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-danger">Logout</button>
                        </form>
                    </div>

        <table>
                                    <thead>
                            <tr>
                                <th class="hidden-column">ID</th>
                                <th>Make</th>
                                <th>Model</th>
                                <th>Year</th>
                                <th>Color</th>
                                <th>Body Type</th>
                                <th>Engine Type</th>
                                <th>License Plate</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
            <tbody>
                                            <tr th:each="car : ${cars}">
                                <td th:text="${car.id}" class="hidden-column">1</td>
                                <td th:text="${car.make}">Toyota</td>
                                <td th:text="${car.model}">Camry</td>
                                <td th:text="${car.year}">2022</td>
                                <td th:text="${car.color}">Silver</td>
                                <td th:text="${car.bodyType}">Sedan</td>
                                <td th:text="${car.engineType}">Gasoline</td>
                                <td th:text="${car.licensePlate}">ABC123</td>
                                <td class="actions">
                                    <a th:href="@{/view/{id}(id=${car.id})}" class="btn btn-primary">View</a>
                                    <a th:href="@{/edit/{id}(id=${car.id})}" class="btn btn-warning">Edit</a>
                                    <a th:href="@{/delete/{id}(id=${car.id})}" class="btn btn-danger" 
                                    onclick="return confirm('Are you sure you want to delete this car?')">Delete</a>
                                </td>
                            </tr>
                                            <tr th:if="${#lists.isEmpty(cars)}">
                                <td colspan="8" style="text-align: center; color: #666;">No cars found. Create your first car!</td>
                            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
